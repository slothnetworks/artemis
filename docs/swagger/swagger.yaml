basePath: /
definitions:
  github_com_slothnetworks_artemis_internal_alerting.Silence:
    properties:
      author:
        type: string
      dst:
        type: string
      id:
        type: string
      reason:
        type: string
      rule:
        type: string
      src:
        type: string
      until:
        type: string
    type: object
  github_com_slothnetworks_artemis_internal_manager.AgentInfo:
    properties:
      group:
        type: string
      id:
        type: string
      ipv4:
        items:
          type: string
        type: array
      ipv6:
        items:
          type: string
        type: array
      last_seen:
        type: string
      listen_addr:
        type: string
      name:
        type: string
      protocols:
        items:
          type: string
        type: array
      remote_addr:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  github_com_slothnetworks_artemis_internal_manager.EdgeView:
    properties:
      dst:
        type: string
      snapshot:
        $ref: '#/definitions/github_com_slothnetworks_artemis_internal_stats.Snapshot'
      src:
        type: string
      updated_at:
        type: string
    type: object
  github_com_slothnetworks_artemis_internal_manager.MeshParams:
    properties:
      burst:
        type: integer
      interval_ms:
        type: integer
      payload_size:
        type: integer
      protocol:
        type: string
    type: object
  github_com_slothnetworks_artemis_internal_manager.TimedSnapshot:
    properties:
      at:
        type: string
      snap:
        $ref: '#/definitions/github_com_slothnetworks_artemis_internal_stats.Snapshot'
    type: object
  github_com_slothnetworks_artemis_internal_manager.TopologyView:
    properties:
      edges:
        items:
          $ref: '#/definitions/github_com_slothnetworks_artemis_internal_manager.EdgeView'
        type: array
      nodes:
        items:
          $ref: '#/definitions/github_com_slothnetworks_artemis_internal_manager.AgentInfo'
        type: array
    type: object
  github_com_slothnetworks_artemis_internal_stats.Snapshot:
    properties:
      avg:
        $ref: '#/definitions/time.Duration'
      bytes:
        type: integer
      dropped:
        type: integer
      effective_mss:
        description: 0 = unknown
        type: integer
      ended_at:
        type: string
      jitter:
        $ref: '#/definitions/time.Duration'
      loss_pct:
        type: number
      max:
        $ref: '#/definitions/time.Duration'
      min:
        $ref: '#/definitions/time.Duration'
      p50:
        $ref: '#/definitions/time.Duration'
      p95:
        $ref: '#/definitions/time.Duration'
      p99:
        $ref: '#/definitions/time.Duration'
      path_mtu:
        description: 0 = unknown
        type: integer
      received:
        type: integer
      sent:
        type: integer
      started_at:
        type: string
      target:
        type: string
      throughput:
        description: bytes/sec over the window
        type: number
      timeout:
        type: integer
      window:
        $ref: '#/definitions/time.Duration'
    type: object
  github_com_slothnetworks_artemis_internal_store.Alert:
    properties:
      dst:
        type: string
      event_count:
        type: integer
      id:
        type: string
      last_event_at:
        type: string
      reason:
        type: string
      resolved_at:
        type: string
      rule:
        type: string
      severity:
        type: string
      silenced:
        type: boolean
      src:
        type: string
      started_at:
        type: string
      state:
        description: firing | resolved
        type: string
    type: object
  internal_api.meshDoc:
    properties:
      mode:
        type: string
      params:
        $ref: '#/definitions/github_com_slothnetworks_artemis_internal_manager.MeshParams'
    type: object
  time.Duration:
    enum:
    - -9223372036854775808
    - 9223372036854775807
    - 1
    - 1000
    - 1000000
    - 1000000000
    - 60000000000
    - 3600000000000
    format: int64
    type: integer
    x-enum-varnames:
    - minDuration
    - maxDuration
    - Nanosecond
    - Microsecond
    - Millisecond
    - Second
    - Minute
    - Hour
info:
  contact: {}
  description: Control-plane REST/SSE API for the artemis connection-quality mesh.
  title: Artemis API
  version: "1.0"
paths:
  /api/agents:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_slothnetworks_artemis_internal_manager.AgentInfo'
            type: array
      summary: List agents
      tags:
      - agents
  /api/alerts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_slothnetworks_artemis_internal_store.Alert'
            type: array
      summary: Active alerts
      tags:
      - alerts
  /api/debug/inject:
    post:
      consumes:
      - application/json
      parameters:
      - description: agent, loss_percent, duration_ms
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Inject packet loss (dev only)
      tags:
      - debug
  /api/edges/{a}/{b}/diff:
    get:
      parameters:
      - description: agent A
        in: path
        name: a
        required: true
        type: string
      - description: agent B
        in: path
        name: b
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Reciprocal edge diff
      tags:
      - edges
  /api/edges/{src}/{dst}/series:
    get:
      parameters:
      - description: source agent
        in: path
        name: src
        required: true
        type: string
      - description: destination agent
        in: path
        name: dst
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_slothnetworks_artemis_internal_manager.TimedSnapshot'
            type: array
      summary: Edge time-series
      tags:
      - edges
  /api/groups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: Agent groups
      tags:
      - mesh
  /api/mesh:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.meshDoc'
      summary: Get mesh config
      tags:
      - mesh
    put:
      consumes:
      - application/json
      parameters:
      - description: mesh mode + params
        in: body
        name: mesh
        required: true
        schema:
          $ref: '#/definitions/internal_api.meshDoc'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.meshDoc'
      summary: Set mesh config
      tags:
      - mesh
  /api/silences:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_slothnetworks_artemis_internal_alerting.Silence'
            type: array
      summary: List silences
      tags:
      - alerts
    post:
      consumes:
      - application/json
      parameters:
      - description: silence matcher + expiry
        in: body
        name: silence
        required: true
        schema:
          $ref: '#/definitions/github_com_slothnetworks_artemis_internal_alerting.Silence'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_slothnetworks_artemis_internal_alerting.Silence'
      summary: Add silence
      tags:
      - alerts
  /api/silences/{id}:
    delete:
      parameters:
      - description: silence id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete silence
      tags:
      - alerts
  /api/topology:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_slothnetworks_artemis_internal_manager.TopologyView'
      summary: Mesh topology
      tags:
      - mesh
swagger: "2.0"
