# Full artemis stack: manager + 3 agents + Postgres + ClickHouse + Prometheus +
# Grafana. From the repo root:  docker compose -f docker/docker-compose.yml up --build
name: artemis

x-agent: &agent-defaults
  build: { context: .., dockerfile: docker/Dockerfile }
  depends_on: { manager: { condition: service_started } }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: artemis
      POSTGRES_PASSWORD: artemis
      POSTGRES_DB: artemis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artemis"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    environment:
      CLICKHOUSE_USER: artemis
      CLICKHOUSE_PASSWORD: artemis
      CLICKHOUSE_DB: artemis
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://artemis:artemis@localhost:8123/ping | grep -q Ok"]
      interval: 3s
      timeout: 3s
      retries: 20

  manager:
    build: { context: .., dockerfile: docker/Dockerfile }
    command:
      - manager
      - --http-addr=:8080
      - --grpc-addr=:8443
      - --postgres-dsn=postgres://artemis:artemis@postgres:5432/artemis
      - --clickhouse-dsn=clickhouse://artemis:artemis@clickhouse:9000/artemis
      - --dev
    environment:
      LOG_FORMAT: logfmt
    ports:
      - "8080:8080"   # UI + API + /metrics
      - "8443:8443"   # gRPC AgentLink
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

  agent-a:
    <<: *agent-defaults
    command: [agent, --manager-addr=manager:8443, --agent-name=agent-a, --group=us, --addr=:8123, --dev]
  agent-b:
    <<: *agent-defaults
    command: [agent, --manager-addr=manager:8443, --agent-name=agent-b, --group=us, --addr=:8123, --dev]
  agent-c:
    <<: *agent-defaults
    command: [agent, --manager-addr=manager:8443, --agent-name=agent-c, --group=eu, --addr=:8123, --dev]
  agent-d:
    <<: *agent-defaults
    command: [agent, --manager-addr=manager:8443, --agent-name=agent-d, --group=eu, --addr=:8123]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
