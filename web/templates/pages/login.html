<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — artemis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode:'class', theme:{ extend:{ colors:{ brand:{ 500:'#6366f1', 600:'#4f46e5' } } } } }</script>
    <style>html,body{background:#0f172a;min-height:100vh}</style>
</head>
<body class="h-screen flex items-center justify-center">
    <div class="w-full max-w-md px-6">
        <div class="inline-flex items-center space-x-3 mb-8">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-brand-500 to-brand-600 flex items-center justify-center">
                <span class="text-white font-bold text-lg">A</span>
            </div>
            <span class="text-xl font-bold text-white">artemis</span>
        </div>
        <h1 class="text-3xl font-bold text-white mb-1">Welcome Back</h1>
        <p class="text-gray-400 mb-6">Sign in to the control plane</p>

        <div id="error-msg" class="hidden mb-4 p-3 bg-red-950/50 border border-red-800/50 rounded-lg">
            <p class="text-sm text-red-300"></p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-200 mb-2">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required
                    class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/50 rounded-lg text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-200 mb-2">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                    class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/50 rounded-lg text-white">
            </div>
            <button type="submit" id="submit-btn"
                class="w-full py-3 px-4 mt-2 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-lg transition-all">
                Sign in
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errMsg = document.getElementById('error-msg');
            btn.disabled = true; btn.textContent = 'Signing in…'; errMsg.classList.add('hidden');
            try {
                const resp = await fetch('/auth/local', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
                    body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }),
                });
                if (resp.ok) { window.location.href = '/'; }
                else { const d = await resp.json().catch(() => ({})); errMsg.querySelector('p').textContent = d.error || 'Invalid credentials'; errMsg.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Sign in'; }
            } catch { errMsg.querySelector('p').textContent = 'Network error'; errMsg.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Sign in'; }
        });
    </script>
</body>
</html>
