{{define "content"}}
<div class="page-head">
    <h1>Dashboard</h1>
    <div class="text-xs muted" id="status">connecting…</div>
</div>

<div class="card">
    <div class="card-head">Topology</div>
    <div class="card-body" style="padding:0">
        <div id="cy" style="height:460px;width:100%;background:#0b1220"></div>
    </div>
</div>

<div class="card hidden" id="edge-panel">
    <div class="card-head" style="display:flex;justify-content:space-between;align-items:center">
        <span id="edge-title">Edge</span>
        <a class="btn btn-ghost btn-xs" id="edge-diff" href="#">compare reciprocal ↔</a>
    </div>
    <div class="card-body">
        <div id="edge-chart" style="width:100%;height:220px"></div>
    </div>
</div>
{{end}}

{{define "page-script"}}
<script src="/static/js/vendor/cytoscape.min.js"></script>
<script src="/static/js/vendor/uplot.iife.min.js"></script>
<script src="/static/js/dashboard.js"></script>
{{end}}
